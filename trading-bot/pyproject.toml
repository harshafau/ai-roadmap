[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-bot"
version = "0.1.0"
description = "Paper-trading bot for DhanHQ with MA-crossover strategy"
requires-python = ">=3.11"
dependencies = [
    "dhanhq>=2.0.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
    "typer>=0.9",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-mock>=3.12"]

[project.scripts]
trading-bot = "trading_bot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
