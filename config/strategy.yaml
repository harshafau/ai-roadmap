# Active strategy + universe + risk + schedule.
# Switch `strategy.name` between:
#   ma_crossover, sweep_vwap_reclaim, volume_profile_poc_vwap, ema_fvg_vwap

strategy:
  name: sweep_vwap_reclaim
  # Per-strategy params (each strategy ignores keys it doesn't use).
  fast_period: 20
  slow_period: 50
  swing_lookback: 20
  atr_period: 14
  rsi_period: 14
  ema_period: 50
  fvg_lookback: 50
  bin_count: 30
  value_area_pct: 0.70
  target_r: 1.5

# Symbols come from a universe CSV. Start with nifty50, switch to nifty100/500
# once you've run scripts/fetch_security_ids.py to populate IDs.
universe: nifty50

risk:
  starting_capital: 1000000      # INR 10,00,000
  per_trade_risk_pct: 1.0        # ₹10,000 risk per trade
  max_open_positions: 3
  daily_max_loss_pct: 3.0        # cut off for the day at ₹30,000 realized loss

schedule:
  # Intraday: every 5 minutes during NSE cash hours, IST.
  cron: "*/5 9-15 * * mon-fri"
  timezone: Asia/Kolkata
  bar_interval_minutes: 5
